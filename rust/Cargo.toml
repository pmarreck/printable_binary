[package]
name = "printable_binary"
version = "0.1.0"
edition = "2021"
description = "PrintableBinary bytewise and canonical Unicode-preserving textual codecs"
license = "MIT"

[lib]
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "printable-binary-rs"
path = "src/main.rs"
